# Fetches live BOM station readings, wind warnings, the BOM forecast
# bulletin and Ports Victoria shipping movements, then publishes the
# result as live.json to the 'data' branch (never to main).
#
# The 'data' branch is orphaned/force-pushed on every run (single commit,
# no history growth) and is read client-side via raw.githubusercontent.com,
# which serves CORS-enabled responses — so this never touches the site's
# Next.js build/deploy pipeline in nextjs.yml.

name: Fetch BOM live data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-bom-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch BOM + shipping data
        run: python scripts/fetch_bom.py --out publish/live.json

      - name: Publish to data branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: data
          force_orphan: true
          commit_message: "Update live BOM data"
